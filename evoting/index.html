<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=../#evoting">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Voting Komite Keperawatan RSUD dr. Soedarso</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .card {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      border: 1px solid #e2e8f0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #0d5f5b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 0.5rem;
      color: #0d5f5b;
      font-size: 1.25rem;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      background: #0d5f5b;
      color: white;
      text-decoration: none;
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #094441;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Portal Terpadu Komite Keperawatan</h2>
    <p>Mengalihkan Anda ke modul E-Voting terpadu RSUD dr. Soedarso...</p>
    <a href="../#evoting" class="btn">Klik di sini jika tidak beralih otomatis</a>
  </div>
</body>
</html>
